name: Test on Main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  playwright-e2e:
    name: Playwright E2E
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Playwright E2E tests
        run: bun run test:e2e

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-portable:
    name: Build Portable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Cache Electron builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\\AppData\\Local\\electron-builder\\Cache
            ~\\AppData\\Local\\electron\\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portable Windows app
        run: bun run build:win:ci

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $executable = Resolve-Path 'release\\win-unpacked\\PrintaView.exe' -ErrorAction Stop
          $env:PRINTAVIEW_EXECUTABLE = $executable.Path
          bun run test:packaged

      - name: Upload portable Windows build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PrintaView-portable-windows
          path: release/*-Portable.exe
          if-no-files-found: warn
          retention-days: 14
