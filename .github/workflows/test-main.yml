name: Test on Main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  playwright-e2e:
    name: Playwright E2E
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-portable:
    name: Build Portable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Windows app
        run: npm run build:win

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $env:PRINTAVIEW_EXECUTABLE = (Resolve-Path 'release\win-unpacked\PrintaView.exe').Path
          if (-not $env:PRINTAVIEW_EXECUTABLE) {
            throw 'Packaged application executable was not produced.'
          }
          npm run test:packaged
