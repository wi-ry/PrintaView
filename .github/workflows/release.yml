name: Semantic Release

on:
  workflow_run:
    workflows:
      - Test on Main
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v8
        with:
          extra_plugins: |
            @semantic-release/npm@13.2.0
            @semantic-release/git@11.0.1
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Microsoft Store configuration
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          STORE_ID: ${{ secrets.STORE_ID }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SECRET_VALUE }}
        run: |
          foreach ($name in 'MSIX_IDENTITY_NAME', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME', 'STORE_ID', 'TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Microsoft Store configuration $name is missing. See the Store release setup instructions in README.md."
            }
          }

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $env:RELEASE_VERSION) {
            throw "Release tag version $env:RELEASE_VERSION does not match package.json version $packageVersion."
          }

      - name: Build Windows portable EXE
        run: npm run build:win

      - name: Build unpacked Windows app
        run: npx electron-builder --win dir

      - name: Package unsigned MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: .github/scripts/package-msix.ps1 -Version "${{ needs.release.outputs.version }}"

      - name: Verify release packages
        id: artifact
        shell: bash
        run: |
          EXE_PATH="release/PrintaView-${{ needs.release.outputs.version }}-Portable.exe"
          MSIX_PATH="release/msix/PrintaView_${{ needs.release.outputs.version }}.0_x64.msix"

          for artifact in "$EXE_PATH" "$MSIX_PATH"; do
            if [ ! -f "$artifact" ]; then
              echo "Expected release package not found: $artifact"
              ls -la release
              exit 1
            fi
          done

          echo "exe_path=$EXE_PATH" >> "$GITHUB_OUTPUT"
          echo "msix_path=$MSIX_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload portable EXE to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: PrintaView v${{ needs.release.outputs.version }}
          files: ${{ steps.artifact.outputs.exe_path }}

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Microsoft Store CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SECRET_VALUE }}
        run: |
          msstore reconfigure `
            --tenantId $env:TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID `
            --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI configuration failed (exit code $LASTEXITCODE)." }

      - name: Submit package to Microsoft Store
        shell: pwsh
        env:
          STORE_ID: ${{ secrets.STORE_ID }}
          MSIX_PATH: ${{ steps.artifact.outputs.msix_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Store {
            & msstore @args
            if ($LASTEXITCODE -ne 0) { throw "msstore $($args[0]) failed (exit code $LASTEXITCODE)." }
          }

          Invoke-Store publish $env:MSIX_PATH -id $env:STORE_ID --noCommit -v --uploadTimeout 300
          Invoke-Store submission publish $env:STORE_ID
          Invoke-Store submission poll $env:STORE_ID
