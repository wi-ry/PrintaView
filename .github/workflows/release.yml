name: Semantic Release

on:
  workflow_run:
    workflows:
      - Test on Main
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all remote tags
        run: git fetch --tags --force

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v8
        with:
          extra_plugins: |
            @semantic-release/npm@13.2.0
            @semantic-release/git@11.0.1
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Track 1: portable EXE -> GitHub release. Independent of the Store track.
  # ---------------------------------------------------------------------------
  build-exe:
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $env:RELEASE_VERSION) {
            throw "Release tag version $env:RELEASE_VERSION does not match package.json version $packageVersion."
          }

      - name: Build Windows portable EXE
        run: npm run build:win

      - name: Verify portable EXE
        id: artifact
        shell: bash
        run: |
          EXE_PATH="release/PrintaView-${{ needs.release.outputs.version }}-Portable.exe"
          if [ ! -f "$EXE_PATH" ]; then
            echo "Expected release package not found: $EXE_PATH"
            ls -la release
            exit 1
          fi
          echo "exe_path=$EXE_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload portable EXE to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: PrintaView v${{ needs.release.outputs.version }}
          files: ${{ steps.artifact.outputs.exe_path }}

  # ---------------------------------------------------------------------------
  # Track 2a: build the unsigned MSIX and keep it as a workflow artifact.
  # Needs only the MSIX identity values, not the Store API credentials.
  # ---------------------------------------------------------------------------
  build-msix:
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate MSIX configuration
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          foreach ($name in 'MSIX_IDENTITY_NAME', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "MSIX configuration $name is missing. See the Store release setup instructions in README.md."
            }
          }

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $env:RELEASE_VERSION) {
            throw "Release tag version $env:RELEASE_VERSION does not match package.json version $packageVersion."
          }

      - name: Build unpacked Windows app
        run: npx electron-builder --win dir

      - name: Package unsigned MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: .github/scripts/package-msix.ps1 -Version "${{ needs.release.outputs.version }}"

      - name: Verify MSIX package
        shell: bash
        run: |
          MSIX_PATH="release/msix/PrintaView_${{ needs.release.outputs.version }}.0_x64.msix"
          if [ ! -f "$MSIX_PATH" ]; then
            echo "Expected release package not found: $MSIX_PATH"
            ls -la release release/msix || true
            exit 1
          fi

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix
          path: release/msix/PrintaView_${{ needs.release.outputs.version }}.0_x64.msix
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Track 2b: submit the MSIX to the Microsoft Store. Can be re-run on its own
  # without rebuilding. Store credentials are only exposed to this job.
  # ---------------------------------------------------------------------------
  submit-store:
    needs: [release, build-msix]
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: windows-latest
    environment: store # optional: add required reviewers here for a manual gate
    concurrency:
      group: store-submission
      cancel-in-progress: false

    steps:
      - name: Validate Microsoft Store configuration
        shell: pwsh
        env:
          STORE_ID: ${{ secrets.STORE_ID }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SECRET_VALUE }}
        run: |
          foreach ($name in 'STORE_ID', 'TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Microsoft Store configuration $name is missing. See the Store release setup instructions in README.md."
            }
          }

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: msix
          path: msix

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Microsoft Store CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SECRET_VALUE }}
        run: |
          msstore reconfigure `
            --tenantId $env:TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID `
            --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Store CLI configuration failed (exit code $LASTEXITCODE)." }

      - name: Submit package to Microsoft Store
        shell: pwsh
        env:
          STORE_ID: ${{ secrets.STORE_ID }}
          MSIX_PATH: msix/PrintaView_${{ needs.release.outputs.version }}.0_x64.msix
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:MSIX_PATH)) {
            Get-ChildItem -Recurse msix | Format-Table FullName
            throw "Expected MSIX package not found: $env:MSIX_PATH"
          }
          function Invoke-Store {
            & msstore @args
            if ($LASTEXITCODE -ne 0) { throw "msstore $($args[0]) failed (exit code $LASTEXITCODE)." }
          }
          Invoke-Store publish $env:MSIX_PATH -id $env:STORE_ID --noCommit -v --uploadTimeout 300
          Invoke-Store submission publish $env:STORE_ID
          Invoke-Store submission poll $env:STORE_ID